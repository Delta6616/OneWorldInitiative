name: Daten aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/manual/**"

permissions:
  contents: write

concurrency:
  group: daten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten abrufen
        run: python src/update_all.py
      - name: Aenderungen speichern
        run: |
          git config user.name "weltmodell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
            git push
          fi

